name: schedule-drift

# Nightly drift check: plans dev through the shared terraform-deploy.yml with
# `drift: true`, which records the result (ok, drifted or failed) as one
# OpsEvents_CL row and never applies or opens a `terraform-pending` issue.
# Here drift means someone edited the zone in the dashboard. To fix it, run
# cd-terraform by hand to put the record back, or bring the change into
# environments/dev.tfvars.
#
# Recording the row needs EVENTS_INGESTION_ENDPOINT and EVENTS_DCR_IMMUTABLE_ID
# on `dev`, which github-repos sets with `send_events`. Without them the check
# still runs and says so in a notice, but nothing alerts.
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    permissions:
      id-token: write
      contents: read
      issues: write # a clean plan closes a stale deploy-failed issue
    uses: jay-withers/workflows/.github/workflows/terraform-deploy.yml@fbb174888805c24e0f0846cf4b58b5ecd90f6fa6 # v1.21.0
    secrets: inherit
    with:
      environment: dev
      drift: true
