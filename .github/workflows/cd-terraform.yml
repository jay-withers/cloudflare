name: cd-terraform

# Plans dev on every merge to main that touches Terraform, through the shared
# terraform-deploy.yml, and applies only when run by hand (Actions -> Run
# workflow). A merge whose plan has changes opens a `terraform-pending` issue
# instead; the manual run applies exactly the plan it prints and closes the
# issue.
#
# Auth, both from the `dev` GitHub environment: github-repos' state-only
# identity (AZURE_CLIENT_ID and friends) for the state backend, and the
# CLOUDFLARE_API_TOKEN secret, a token scoped to DNS edit on the zone, for the
# provider. `secrets: inherit` passes that secret to the called job.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".terraform-version"
      - ".github/workflows/cd-terraform.yml"
  # The manual apply: also re-runs a failed apply, or corrects drift.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    permissions:
      id-token: write
      contents: read
      issues: write # the terraform-pending and deploy-failed issues
    uses: jay-withers/workflows/.github/workflows/terraform-deploy.yml@097b8b97138b3af033cab166dd31e84deccf8f9d # v1.24.11
    secrets: inherit
    with:
      environment: dev
      apply: ${{ github.event_name == 'workflow_dispatch' }}
