name: ci-terraform

# Terraform CI. `validate` (and the mocked-provider tests) come from the shared
# terraform.yml; `plan` from the shared terraform-deploy.yml, which comments
# the plan on the PR. Only `dev` exists: there is one zone.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Credential-free init, validate and terraform test (mocked provider).
  # pull-requests: read is what the shared workflow's own path filter needs.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    uses: jay-withers/workflows/.github/workflows/terraform.yml@097b8b97138b3af033cab166dd31e84deccf8f9d # v1.24.11
    with:
      test-directories: '["terraform"]'

  # Plans dev against the live zone, through the same shared workflow and
  # environment cd-terraform applies with. Two credentials, both from the
  # `dev` GitHub environment: Azure OIDC for the state backend only (the
  # identity is state-only, see github-repos' state_consumers), and the
  # CLOUDFLARE_API_TOKEN secret for the provider. `secrets: inherit` is what
  # lets the called job see that secret; without it the provider runs with no
  # token and the plan fails.
  plan:
    needs: terraform
    if: needs.terraform.outputs.changed == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write # the plan comment
    uses: jay-withers/workflows/.github/workflows/terraform-deploy.yml@097b8b97138b3af033cab166dd31e84deccf8f9d # v1.24.11
    secrets: inherit
    with:
      environment: dev

  # Required status check for the plan job: the shared workflow's own gate
  # ("terraform / Terraform") covers only what runs inside it. Skipped counts
  # as success, so a pull request touching no Terraform passes.
  terraform-plan:
    needs: plan
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the plan job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          echo "plan=$PLAN_RESULT"
          if [ "$PLAN_RESULT" = "failure" ]; then
            echo "::error::The Terraform plan failed."
            exit 1
          fi
